services:
  mysql:
    image: mysql:8.4
    container_name: stock-ledger-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: stockledger123
      MYSQL_DATABASE: stock_ledger
      MYSQL_USER: stock
      MYSQL_PASSWORD: stockledger123
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
