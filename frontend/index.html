<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>股票账本 · Stock Ledger</title>
    <script>
      (function () {
        var hour = new Date().getHours()
        document.documentElement.dataset.theme = hour >= 20 || hour < 8 ? 'dark' : 'light'
      })()
    </script>
    <style>
      html[data-theme='dark'] { background: #131722; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
